<title>The Traveler's Kit</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: an inventory box lined with indigo cloth — items on the left, the inspect stage on the right; one column on a phone. */
:root {
  --bg: #1b1620;           /* lacquered box, near-black plum */
  --cloth: #232946;        /* indigo lining */
  --cloth-2: #2c3458;
  --paper: #efe4cb;        /* washi */
  --ink: #e9dfc8;
  --muted: #a99f93;
  --gold: #d9b45c;
  --red: #b8443a;
  --stage: #2a2230;
  --line: #3b3045;
  --focus: #f1d184;
  --display: "Pixelify Sans", "Courier New", monospace;
  --body: "Zen Kaku Gothic New", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1160px; margin: 0 auto; padding-block: 20px 32px; display: grid; gap: 18px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(26px, 4vw, 38px); letter-spacing: .02em; margin: 0;
  color: var(--paper); text-wrap: balance; }
header p { margin: 0; color: var(--muted); max-width: 60ch; }
.main { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .main { grid-template-columns: minmax(0, 1fr); } .inv { order: 2; } }
.inv { background: var(--cloth); border: 2px solid var(--line); border-radius: 6px; padding: 12px;
  background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.025) 0 2px, transparent 2px 7px); }
.inv h2, .panel h2 { font-family: var(--display); font-size: 15px; font-weight: 400; letter-spacing: .08em;
  text-transform: uppercase; color: var(--gold); margin: 0 0 10px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.slot { background: var(--cloth-2); border: 2px solid transparent; border-radius: 4px; padding: 6px 4px 4px;
  display: grid; gap: 4px; justify-items: center; cursor: pointer; color: var(--ink); font: inherit; min-width: 0; }
.slot canvas { width: 76px; height: 64px; image-rendering: pixelated; }
.slot span { font-size: 12px; line-height: 1.2; text-align: center; color: var(--muted); }
.slot[aria-pressed="true"] { border-color: var(--gold); background: #343d68; }
.slot[aria-pressed="true"] span { color: var(--paper); }
.slot:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.panel { display: grid; gap: 12px; min-width: 0; }
.stage { position: relative; background: var(--stage); border: 2px solid var(--line); border-radius: 6px; overflow: hidden;
  aspect-ratio: 4 / 3; max-width: 100%; touch-action: none; cursor: grab;
  background-image: radial-gradient(ellipse at 50% 85%, rgba(217,180,92,.10), transparent 60%); }
.stage.dragging { cursor: grabbing; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; }
.hint { position: absolute; left: 12px; bottom: 10px; font-family: var(--display); font-size: 13px; color: var(--muted);
  pointer-events: none; }
.name { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.name h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 24px; color: var(--paper); }
.name p { margin: 0; color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row b { font-family: var(--display); font-weight: 400; font-size: 13px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--gold); min-width: 74px; }
button.chip { font: inherit; font-size: 14px; color: var(--ink); background: var(--cloth); border: 2px solid var(--line);
  border-radius: 4px; padding: 6px 12px; cursor: pointer; }
button.chip:hover { border-color: var(--muted); }
button.chip[aria-pressed="true"] { background: var(--red); border-color: #e0705d; color: #fff3e4; }
.blurb { color: var(--ink); max-width: 65ch; margin: 0; }
@media (prefers-reduced-motion: reduce) { .slot { transition: none; } }
</style>

<div class="wrap">
  <header>
    <h1>The Traveler's Kit</h1>
    <p>Everything the wandering tea brewer carries. Pick a thing, drag it to turn it in your hands, tap to use it.</p>
  </header>
  <div class="main">
    <section class="inv" aria-label="Inventory">
      <h2>Inventory</h2>
      <div class="grid" id="grid"></div>
    </section>
    <section class="panel">
      <div class="stage" id="stage" aria-label="Inspect view: drag to turn">
        <canvas id="view"></canvas>
        <div class="hint" id="hint">Drag to turn</div>
      </div>
      <div class="name"><h3 id="title"></h3><p id="sub"></p></div>
      <div class="row" id="anims"><b>Use</b></div>
      <div class="row" id="variants"><b>Condition</b></div>
      <p class="blurb" id="blurb"></p>
    </section>
  </div>
</div>

<script id="kit" type="application/json">__KIT__</script>
<script>
(function () {
  const KIT = JSON.parse(document.getElementById('kit').textContent);
  const images = {};
  function sheet(path) {
    if (!images[path]) { const im = new Image(); im.src = path; images[path] = im; }
    return images[path];
  }
  const grid = document.getElementById('grid');
  const view = document.getElementById('view');
  const stage = document.getElementById('stage');
  const ctx = view.getContext('2d');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let cur = null, variant = null, anim = null, frame = 0, once = false, turnPos = 0, lastT = 0;

  function item() { return KIT.items[cur]; }
  function vdata() { return item().variants[variant]; }
  function adata(a) { return vdata().animations[a || anim]; }

  function drawFrame(c, a, f, scaleMode) {
    const im = sheet(a.src);
    const g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, c.width, c.height);
    if (!im.complete || !im.naturalWidth) return;
    const s = scaleMode === 'fit' ? Math.max(1, Math.floor(Math.min(c.width / a.w, c.height / a.h)))
                                  : Math.min(c.width / a.w, c.height / a.h);
    const w = a.w * s, h = a.h * s;
    g.drawImage(im, f * a.w, 0, a.w, a.h, Math.round((c.width - w) / 2), Math.round((c.height - h) / 2), w, h);
  }

  function resize() {
    const r = stage.getBoundingClientRect();
    const d = Math.min(window.devicePixelRatio || 1, 2);
    view.width = Math.round(r.width * d); view.height = Math.round(r.height * d);
  }
  window.addEventListener('resize', resize);

  function setButtons() {
    const it = item();
    document.getElementById('title').textContent = it.name;
    document.getElementById('sub').textContent = vdata().label;
    document.getElementById('blurb').textContent = it.blurb || '';
    const ar = document.getElementById('anims');
    ar.querySelectorAll('button').forEach(b => b.remove());
    Object.keys(vdata().animations).filter(a => a !== 'turn' && a !== 'idle').forEach(a => {
      const b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.textContent = (it.labels && it.labels[a]) || a.replace(/_/g, ' ');
      b.addEventListener('click', () => play(a));
      ar.appendChild(b);
    });
    const vr = document.getElementById('variants');
    vr.querySelectorAll('button').forEach(b => b.remove());
    const vs = Object.keys(it.variants);
    vr.hidden = vs.length < 2;
    vs.forEach(v => {
      const b = document.createElement('button');
      b.className = 'chip'; b.type = 'button'; b.textContent = it.variants[v].label;
      b.setAttribute('aria-pressed', String(v === variant));
      b.addEventListener('click', () => { variant = v; rest(); setButtons(); });
      vr.appendChild(b);
    });
    document.getElementById('hint').textContent = vdata().animations.turn ? 'Drag to turn' : 'Tap a use below';
  }
  function rest() { anim = vdata().animations.idle ? 'idle' : (vdata().animations.turn ? 'turn' : Object.keys(vdata().animations)[0]); frame = 0; once = false; }
  function play(a) { anim = a; frame = 0; once = true; }
  function select(k) {
    cur = k;
    const vs = Object.keys(item().variants);
    variant = vs.includes(variant) ? variant : vs[0];
    rest(); setButtons();
    grid.querySelectorAll('.slot').forEach(s => s.setAttribute('aria-pressed', String(s.dataset.k === k)));
  }

  Object.keys(KIT.items).forEach(k => {
    const it = KIT.items[k];
    const b = document.createElement('button');
    b.className = 'slot'; b.type = 'button'; b.dataset.k = k;
    const c = document.createElement('canvas'); c.width = 152; c.height = 128;
    const s = document.createElement('span'); s.textContent = it.name;
    b.append(c, s);
    b.addEventListener('click', () => select(k));
    grid.appendChild(b);
    const v0 = it.variants[Object.keys(it.variants)[0]];
    const a0 = v0.animations.turn || v0.animations.idle || v0.animations[Object.keys(v0.animations)[0]];
    const im = sheet(a0.src);
    const draw = () => drawFrame(c, a0, 0, 'scale');
    if (im.complete) draw(); else im.addEventListener('load', draw);
  });

  // drag to turn
  let dragX = null, dragStart = 0;
  stage.addEventListener('pointerdown', e => {
    if (!vdata().animations.turn) return;
    if (anim !== 'turn') { anim = 'turn'; once = false; }
    dragX = e.clientX; dragStart = turnPos; stage.setPointerCapture(e.pointerId); stage.classList.add('dragging');
  });
  stage.addEventListener('pointermove', e => {
    if (dragX === null) return;
    const n = adata('turn').frames;
    turnPos = dragStart + (e.clientX - dragX) / Math.max(6, stage.clientWidth / (n * 1.2));
  });
  const end = () => { dragX = null; stage.classList.remove('dragging'); };
  stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);

  function tick(t) {
    const a = adata();
    if (a) {
      if (anim === 'turn') {
        const n = a.frames;
        if (dragX === null && !reduce) turnPos += 0;      // stays where you leave it
        frame = ((Math.round(turnPos) % n) + n) % n;
      } else if (t - lastT >= 1000 / a.fps) {
        lastT = t;
        frame += 1;
        if (frame >= a.frames) {
          if (once) { rest(); } else frame = 0;
        }
      }
      drawFrame(view, adata(), Math.min(frame, adata().frames - 1), 'fit');
    }
    requestAnimationFrame(tick);
  }
  resize();
  select(Object.keys(KIT.items)[0]);
  requestAnimationFrame(tick);
})();
</script>
