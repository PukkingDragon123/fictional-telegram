<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Forest Finds</title>
<style>
  :root { --bg: #3e5a2e; --panel: #36502a; --ink: #f6f1df; --dim: #cfe0b0; --line: #2a3e20; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 13px/1.3 ui-monospace, Menlo, Consolas, monospace; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: 1px; }
  h2 { font-size: 14px; margin: 18px 0 8px; color: #ffe38a; letter-spacing: 1px; text-transform: uppercase; }
  .sub { color: var(--dim); margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; padding: 8px 6px; border-top: 1px solid var(--line); }
  .cell { display: flex; flex-direction: column; align-items: center; }
  .floor { background: #4c5a2c; padding: 6px; }
  canvas { image-rendering: pixelated; display: block; }
  .lbl { font-size: 10px; color: var(--dim); margin-top: 3px; text-align: center; max-width: 160px; }
  .errors { color: #ffd0c0; white-space: pre-wrap; }
  .ok { color: #e0ffb0; }
  .icons { background: #f3e2b8; padding: 8px; color: #3a2a18; }
  .icons .lbl { color: #6a5040; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="./forest-preview.js"></script>
</body>
</html>
