<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sprite Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
<style>
  :root { --bg: #0f1a24; --panel: rgba(15, 26, 36, 0.92); --ink: #e8f0f4; --dim: #7f95a6; --light: #efe6d2; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 20px; background: var(--bg); color: var(--ink); font-family: 'Pixelify Sans', 'Silkscreen', monospace; }
  h1 { font-family: 'Silkscreen', monospace; font-size: 22px; margin: 0 0 4px; letter-spacing: 1px; }
  h2 { font-family: 'Silkscreen', monospace; font-size: 14px; margin: 22px 0 10px; color: #ffd23f; letter-spacing: 1px; }
  .sub { color: var(--dim); font-size: 13px; }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .cell { width: 92px; min-height: 86px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
          padding: 6px 4px 4px; background: var(--panel); border: 2px solid #fff; }
  .cell .lbl { font-size: 11px; margin-top: 6px; color: var(--ink); text-align: center; word-break: break-all; line-height: 1.1; }
  .cell .sz { font-size: 9px; color: var(--dim); }
  .fox { width: auto; min-width: 150px; padding: 10px 10px 6px; }
  .light { background: var(--light); padding: 12px; border: 2px solid #fff; margin-top: 6px; }
  .light .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; }
  .strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: flex-end; padding: 10px; background: var(--panel); border: 2px solid #fff; }
  .hud { display: inline-flex; align-items: center; gap: 12px; padding: 8px 14px; background: var(--panel); border: 2px solid #fff; font-size: 18px; margin: 4px 8px 4px 0; }
  .hud b { font-family: 'Silkscreen', monospace; font-weight: 400; }
  .speech { display: flex; gap: 12px; align-items: flex-start; background: var(--panel); border: 2px solid #fff; padding: 10px; max-width: 560px; }
  .speech p { margin: 4px 0 0; font-size: 17px; line-height: 1.3; }
  .speech .who { color: #f28a3c; font-family: 'Silkscreen', monospace; font-size: 13px; }
  .errors { color: #ff8d72; white-space: pre-wrap; font-family: monospace; font-size: 13px; }
  .ok { color: #94d15a; }
  img.px { image-rendering: pixelated; display: block; }
  /* zoom mode */
  .zoomwrap { display: flex; flex-wrap: wrap; gap: 16px; }
  .zoom { position: relative; display: inline-block; }
  .zoom .gridov { position: absolute; inset: 0; pointer-events: none; }
  .zoomcell { padding: 8px; border: 2px solid #fff; }
  .zoomcell.dark { background: var(--bg); }
  .zoomcell.lightbg { background: var(--light); color: #222; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { SPRITES, FOX_EXPRESSIONS, spriteImg, spriteURL, spriteCanvas, foxPortraitURL, hasSprite } from '/src/ui/sprites.js';

const REQUIRED = ['coin','coins','star','star_empty','star_half','heart','heart_broken','fish','fish_gold','egg','honey','syrup','berry','seaweed','bug','flower','clock','calendar','hourglass','hammer','flask','shovel','trash','hand','food','beaver','bear','bear_angry','bear_happy','briefcase','necktie','tophat','gear','book','speaker_on','speaker_off','music','play','pause','fast','faster','bell','lock','check','cross','arrow_up','arrow_down','plus','minus','sparkle','bolt','dam','fence','platform','gate','feeder','lilypad','cattail','willow','hive','maple','tree','lodge','aerator','bughotel','camera','rotate_left','rotate_right','zoom_in','zoom_out','menu','trophy','save','home','warning','info','newspaper','chart','pond','eye','fox'];
const BEARS = ['bear_office','bear_intern','bear_janitor','bear_accountant','bear_construction','bear_boss','bear_ceo','bear_cub','bear_tourist','bear_critic','bear_lumberjack'];

function validate() {
  const errs = [];
  for (const [name, s] of Object.entries(SPRITES)) {
    if (s.rows.length !== s.h) errs.push(`${name}: rows ${s.rows.length} != h ${s.h}`);
    s.rows.forEach((r, i) => {
      if (r.length !== s.w) errs.push(`${name}: row ${i} len ${r.length} != w ${s.w}`);
      for (const ch of r) if (ch !== '.' && !/^#[0-9a-f]{6}$/i.test(s.pal[ch] || '')) errs.push(`${name}: row ${i} char '${ch}' not in palette`);
    });
  }
  for (const n of [...REQUIRED, ...BEARS]) if (!hasSprite(n)) errs.push(`missing sprite: ${n}`);
  for (const e of FOX_EXPRESSIONS) {
    const s = SPRITES['fox_' + e];
    if (!s) errs.push(`missing fox expression: ${e}`);
    else if (s.w !== 32 || s.h !== 32) errs.push(`fox_${e} is ${s.w}x${s.h}, want 32x32`);
  }
  try { spriteURL('__nope__', 2); spriteImg('__nope__'); } catch (e) { errs.push('unknown sprite threw: ' + e.message); }
  return errs;
}

const q = new URLSearchParams(location.search);
const app = document.getElementById('app');

function cell(name, scale, extra = '') {
  const s = SPRITES[name];
  return `<div class="cell ${extra}">${spriteImg(name, scale)}<div class="lbl">${name}</div><div class="sz">${s ? s.w + 'x' + s.h : '?'}</div></div>`;
}

if (q.get('zoom')) {
  const names = q.get('zoom').split(',').map((n) => n.trim()).filter(Boolean);
  const sc = +(q.get('s') || 10);
  const grid = q.get('grid') !== '0';
  const bgs = (q.get('bg') || 'dark').split(',');
  let html = '<div class="zoomwrap">';
  for (const n of names) {
    for (const bg of bgs) {
      const s = SPRITES[n] || { w: 10, h: 10 };
      html += `<div class="zoomcell ${bg === 'light' ? 'lightbg' : 'dark'}"><div class="zoom">${spriteImg(n, sc)}` +
        (grid ? `<canvas class="gridov" data-w="${s.w}" data-h="${s.h}" data-s="${sc}" width="${s.w * sc}" height="${s.h * sc}"></canvas>` : '') +
        `</div><div class="lbl" style="margin-top:4px;font-size:13px">${n} ${bg}</div>` +
        `<div style="display:flex;gap:6px;align-items:flex-end;margin-top:6px">${spriteImg(n, 1)}${spriteImg(n, 2)}${spriteImg(n, 3)}</div></div>`;
    }
  }
  html += '</div>';
  app.innerHTML = html;
  document.querySelectorAll('canvas.gridov').forEach((cv) => {
    const ctx = cv.getContext('2d');
    const w = +cv.dataset.w, h = +cv.dataset.h, s = +cv.dataset.s;
    ctx.strokeStyle = 'rgba(255,255,255,0.13)';
    ctx.lineWidth = 1;
    for (let x = 0; x <= w; x++) { ctx.beginPath(); ctx.moveTo(x * s + 0.5, 0); ctx.lineTo(x * s + 0.5, h * s); ctx.stroke(); }
    for (let y = 0; y <= h; y++) { ctx.beginPath(); ctx.moveTo(0, y * s + 0.5); ctx.lineTo(w * s, y * s + 0.5); ctx.stroke(); }
    ctx.strokeStyle = 'rgba(255,210,63,0.35)';
    for (let x = 0; x <= w; x += 4) { ctx.beginPath(); ctx.moveTo(x * s + 0.5, 0); ctx.lineTo(x * s + 0.5, h * s); ctx.stroke(); }
    for (let y = 0; y <= h; y += 4) { ctx.beginPath(); ctx.moveTo(0, y * s + 0.5); ctx.lineTo(w * s, y * s + 0.5); ctx.stroke(); }
  });
} else {
  const errs = validate();
  const all = Object.keys(SPRITES);
  const foxNames = FOX_EXPRESSIONS.map((e) => 'fox_' + e);
  const icons = all.filter((n) => !foxNames.includes(n) && !BEARS.includes(n));
  const has = (n) => hasSprite(n);
  let html = `<h1>The Bear Must Eat &mdash; UI sprites</h1><div class="sub">${all.length} sprites &middot; icons at 3x, portraits at 4x &middot; ` +
    (errs.length ? `<span class="errors">${errs.length} problems</span>` : `<span class="ok">validation OK</span>`) + `</div>`;
  if (errs.length) html += `<div class="errors">${errs.join('\n')}</div>`;

  html += `<h2>Reynard &mdash; 32x32 portraits @4x</h2><div class="grid">`;
  for (const e of FOX_EXPRESSIONS) {
    html += `<div class="cell fox"><img class="px" src="${foxPortraitURL(e, 4)}" width="128" height="128" alt=""><div class="lbl">${e}</div></div>`;
  }
  html += `</div>`;

  html += `<h2>In context</h2>`;
  html += `<div class="speech"><img class="px" src="${foxPortraitURL('greedy', 3)}" width="96" height="96" alt=""><div><div class="who">REYNARD</div><p>Five o'clock, darling. The suits are coming. Feed them, bill them, and ${spriteImg('coin', 2, 'inl')} keep the change.</p></div></div>`;
  const hud = (items) => `<div class="hud">${items.map(([n, t]) => `${has(n) ? spriteImg(n, 2) : ''}<b>${t}</b>`).join('')}</div>`;
  html += `<div style="margin-top:8px">` + hud([['coin', '1,250'], ['star', '4.5'], ['heart', '12'], ['fish', '38']]) + hud([['clock', '4:45 PM'], ['calendar', 'DAY 3']]) + hud([['pause', ''], ['play', ''], ['fast', ''], ['faster', '']]) + `</div>`;

  html += `<h2>Reservations &mdash; bears 16x16 @3x</h2><div class="grid">${BEARS.filter(has).map((n) => cell(n, 3)).join('')}</div>`;
  html += `<h2>Icons @3x</h2><div class="grid">${icons.map((n) => cell(n, 3)).join('')}</div>`;

  html += `<h2>Light background @2x</h2><div class="light"><div class="row">` +
    FOX_EXPRESSIONS.map((e) => `<img class="px" src="${foxPortraitURL(e, 2)}" width="64" height="64" alt="">`).join('') + `</div><div class="row" style="margin-top:10px">` +
    [...BEARS.filter(has), ...icons].map((n) => spriteImg(n, 2)).join('') + `</div></div>`;

  html += `<h2>Actual size 1x (dark) &amp; 2x</h2><div class="strip">${[...icons, ...BEARS.filter(has)].map((n) => spriteImg(n, 1)).join('')}</div>` +
    `<div class="strip" style="margin-top:6px">${[...foxNames, ...BEARS.filter(has)].map((n) => spriteImg(n, 2)).join('')}</div>`;
  html += `<h2>Placeholder for unknown names</h2><div class="grid">${cell('does_not_exist', 3)}</div>`;
  app.innerHTML = html;
  window.__spriteErrors = errs;
}
window.__ready = true;
</script>
</body>
</html>
