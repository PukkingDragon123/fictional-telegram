<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sprite Sheet</title>
<style>
  @font-face { font-family: 'Pixelify Sans'; src: url('/node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: 'Pixelify Sans'; src: url('/node_modules/@fontsource/pixelify-sans/files/pixelify-sans-latin-700-normal.woff2') format('woff2'); font-weight: 700; }
  @font-face { font-family: 'Silkscreen'; src: url('/node_modules/@fontsource/silkscreen/files/silkscreen-latin-400-normal.woff2') format('woff2'); font-weight: 400; }
  :root {
    --parch: #f3e2b8; --parch-hi: #fbf0d0; --parch-sh: #e2c992; --parch-ol: #4a2f1d;
    --wood: #6b4220; --wood-d: #3b2414; --wood-l: #8b5a2b;
    --ink: #2a1a14; --muted: #8a6a44; --green: #3f8f5f; --gold: #ffd23f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #24160e; color: var(--ink); font-family: 'Pixelify Sans', system-ui, sans-serif; }
  h1 { font-family: 'Silkscreen', monospace; font-size: 22px; margin: 0 0 4px; color: var(--gold); letter-spacing: 1px; }
  h2 { font-family: 'Silkscreen', monospace; font-size: 14px; margin: 18px 0 8px; color: #fbf0d0; letter-spacing: 1px; font-weight: 400; }
  .sub { color: #c9a878; font-size: 13px; }
  .errors { color: #ff8d72; white-space: pre-wrap; font-family: monospace; font-size: 12px; }
  .ok { color: #8fd18a; }
  img.px { image-rendering: pixelated; display: block; }
  .bgp { background: var(--parch); border: 2px solid var(--parch-ol); box-shadow: inset 2px 2px 0 var(--parch-hi), inset -2px -2px 0 var(--parch-sh); }
  .bgw { background: var(--wood); border: 2px solid var(--wood-d); box-shadow: inset 2px 2px 0 var(--wood-l), inset -2px -2px 0 #55331a; color: #fbf0d0; }
  .sheet { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .grid { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; }
  .cell { min-width: 78px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding: 4px 2px 3px; gap: 3px; }
  .cell .pair { display: flex; gap: 6px; align-items: flex-end; }
  .cell .lbl { font-size: 10px; line-height: 1.05; text-align: center; word-break: break-all; max-width: 110px; }
  .bgw .lbl { color: #f3e2b8; }
  .bgp .lbl { color: #4a2f1d; }
  .zoomwrap { display: flex; flex-wrap: wrap; gap: 10px; }
  .zoomcell { padding: 8px; }
  .zoomcell .lbl { font-size: 12px; margin-top: 4px; }
  .row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
const q = new URLSearchParams(location.search);
const mod = await import(q.get('mod') === 'next' ? '/src/ui/sprites.next.js' : '/src/ui/sprites.js');
const { SPRITES, FOX_EXPRESSIONS, spriteImg, hasSprite } = mod;
const app = document.getElementById('app');
const names = Object.keys(SPRITES);

function groupOf(n) {
  if (n.startsWith('fox_')) return 'Reynard portraits';
  if (n.startsWith('bear_') || n === 'bear') return 'Bears';
  if (n.startsWith('sticker_')) return 'Stickers';
  if (n.startsWith('stamp_')) return 'Stamps';
  if (n.startsWith('egg_')) return 'Eggs';
  if (n.startsWith('emo_')) return 'Emotes (B&W)';
  return 'Icons';
}
const ORDER = ['Icons', 'Bears', 'Reynard portraits', 'Stickers', 'Stamps', 'Eggs', 'Emotes (B&W)'];

function cell(n, scales) {
  const s = SPRITES[n];
  return `<div class="cell"><div class="pair">${scales.map((k) => spriteImg(n, k)).join('')}</div><div class="lbl">${n}<br>${s.w}x${s.h}</div></div>`;
}

if (q.get('zoom')) {
  let list = q.get('zoom').split(',').map((x) => x.trim()).filter(Boolean);
  if (list.length === 1 && list[0].endsWith('*')) list = names.filter((n) => n.startsWith(list[0].slice(0, -1)));
  const sc = +(q.get('s') || 6);
  let html = '<div class="zoomwrap">';
  for (const n of list) {
    for (const bg of (q.get('bg') || 'p,w').split(',')) {
      html += `<div class="zoomcell ${bg === 'w' ? 'bgw' : 'bgp'}">${spriteImg(n, sc)}<div class="lbl">${n}</div><div class="row" style="margin-top:4px">${spriteImg(n, 1)}${spriteImg(n, 2)}</div></div>`;
    }
  }
  app.innerHTML = html + '</div>';
} else {
  const only = q.get('group');
  const groups = {};
  for (const n of names) (groups[groupOf(n)] ||= []).push(n);
  const warn = mod.__dev ? mod.__dev.BUILD_WARN : [];
  let html = `<h1>The Bear Must Eat &mdash; UI sprites</h1><div class="sub">${names.length} sprites &middot; each shown at 2x and 3x</div>`;
  let body = '';
  for (const g of ORDER) {
    if (!groups[g] || (only && only !== g)) continue;
    const sc = g === 'Reynard portraits' ? [2, 3] : g === 'Emotes (B&W)' ? [2, 3] : [2, 3];
    body += `<h2>${g} (${groups[g].length})</h2><div class="sheet">`;
    for (const bg of ['bgp', 'bgw']) body += `<div class="grid ${bg}">${groups[g].map((n) => cell(n, sc)).join('')}</div>`;
    body += `</div>`;
  }
  html += warn.length ? `<div class="errors">${warn.join('\n')}</div>` : `<div class="sub ok">no build warnings</div>`;
  app.innerHTML = html + body;
}
window.__ready = true;
</script>
</body>
</html>
