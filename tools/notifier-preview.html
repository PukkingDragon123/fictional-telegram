<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fox notifier preview</title>
<style>
  :root { --bg: #8fc46a; --ink: #22161f; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: bold 13px/1.3 'Trebuchet MS', system-ui, sans-serif; color: var(--ink); }
  body { background: var(--bg); background-image:
    radial-gradient(circle at 20% 30%, #6fb3d6 0 14%, transparent 14.2%),
    repeating-conic-gradient(#86bb61 0 25%, #8fc46a 0 50%); background-size: 100% 100%, 16px 16px; }
  #ui { position: fixed; left: 10px; top: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 520px; }
  #ui button { font: inherit; background: #fff8ea; border: 3px solid var(--ink); padding: 6px 10px; cursor: pointer; box-shadow: 0 3px 0 var(--ink); }
  #ui button:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  #bubble { position: fixed; left: 0; top: 0; pointer-events: none; image-rendering: pixelated; display: none; z-index: 70; }
</style>
</head>
<body>
<div id="ui"></div>
<canvas id="bubble"></canvas>
<script type="module" src="./notifier-preview.js"></script>
</body>
</html>
