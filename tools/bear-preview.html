<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bear Rig Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #2a2034; --panel: rgba(30, 22, 38, 0.86); --ink: #fff4e4; --dim: #c9b8a8; --hot: #ffb347; --btn: #43324f; --btn2: #5a4468; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; color: var(--ink); }
  #stage { position: absolute; left: 0; right: 0; top: 0; display: flex; }
  #stage canvas { display: block; image-rendering: pixelated; }
  #closeWrap, #lineWrap { position: relative; overflow: hidden; }
  .tag { position: absolute; left: 8px; top: 6px; padding: 2px 6px; background: var(--panel); border-radius: 4px; color: var(--dim); pointer-events: none; }
  #ui { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
  #ui .row { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
  #ui .lbl { color: var(--dim); width: 44px; }
  #ui button { background: var(--btn); color: var(--ink); border: 0; border-radius: 4px; padding: 2px 6px; font: inherit; cursor: pointer; }
  #ui button:hover { background: var(--btn2); }
  #ui button.on { background: var(--hot); color: #2a1a10; }
  #ui input[type=range] { width: 90px; }
  #ui.hidden { display: none; }
  .bubble { position: absolute; transform: translate(-50%, -100%); padding: 3px 7px; background: #fffaf0; color: #3a1a10; border: 2px solid #3a1a10; border-radius: 8px; font: bold 13px/1 ui-monospace, monospace; white-space: nowrap; pointer-events: none; }
  .bubble::after { content: ''; position: absolute; left: 50%; bottom: -8px; margin-left: -5px; border: 5px solid transparent; border-top-color: #3a1a10; }
  #info { position: absolute; right: 8px; top: 6px; padding: 2px 6px; background: var(--panel); border-radius: 4px; color: var(--dim); pointer-events: none; text-align: right; }
</style>
</head>
<body>
<div id="stage">
  <div id="closeWrap"><canvas id="close"></canvas><div class="tag" id="closeTag">close-up</div></div>
  <div id="lineWrap"><canvas id="line"></canvas><div class="tag">lineup (game zoom)</div></div>
</div>
<div id="info"></div>
<div id="ui"></div>
<script type="module" src="./bear-preview.js"></script>
</body>
</html>
