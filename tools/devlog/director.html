<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TBME devlog director</title>
<style>
/* the game's own pixel font (TBME Goofy, src/ui/fonts.css) */
@font-face { font-family: 'TBME Goofy'; src: url('../../src/assets/fonts/TBMEGoofy-Regular.woff2') format('woff2'); }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#bg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#fox { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 52; pointer-events: none; }
#ui { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; font-family: 'TBME Goofy', sans-serif; }
#ui > * { position: absolute; }
.px { image-rendering: pixelated; }
/* chunky pixel outline: hard 4px steps in 8 directions + a drop */
.ol { --o: #1b1420; text-shadow: 5px 0 var(--o), -5px 0 var(--o), 0 5px var(--o), 0 -5px var(--o), 5px 5px var(--o), -5px 5px var(--o), 5px -5px var(--o), -5px -5px var(--o), 0 10px var(--o), 5px 10px var(--o), -5px 10px var(--o); }
/* pixel panel: square corners notched by box-shadow borders */
.pp { background: #fffaf0; color: #1b1420; box-shadow: 0 -6px 0 0 #1b1420, 0 6px 0 0 #1b1420, -6px 0 0 0 #1b1420, 6px 0 0 0 #1b1420, 0 12px 0 0 rgba(0,0,0,0.35); }
/* captions, word by word */
#cap { z-index: 55; left: 40px; width: 1000px; text-align: center; font-size: 90px; line-height: 1.12; color: #fff; transform-origin: 50% 50%; white-space: normal; word-spacing: 0.08em; }
#cap span { display: inline-block; margin: 0 0.1em; transform-origin: 50% 80%; }
#cap span.on { color: #ffd84a; transform: translateY(-6px) scale(1.12); }
.hook { z-index: 40; left: 0; width: 1080px; top: 250px; text-align: center; transform-origin: 50% 0; }
.hook div { display: table; margin: 0 auto 12px; padding: 6px 26px 10px; font-size: 76px; line-height: 1.1; }
.badge { z-index: 40; left: 44px; top: 236px; padding: 6px 20px 9px; font-size: 54px; line-height: 1; }
.tag { z-index: 32; padding: 6px 20px 9px; font-size: 60px; line-height: 1; transform-origin: 0 50%; }
.tag.red { background: #ff4d6d; color: #fff; } .tag.green { background: #3fbf6a; color: #fff; } .tag.dark { background: #1b1420; color: #fff; box-shadow: 0 -6px 0 0 #fff, 0 6px 0 0 #fff, -6px 0 0 0 #fff, 6px 0 0 0 #fff; }
.label { z-index: 31; font-size: 64px; color: #fff; white-space: nowrap; transform: translate(-50%, -100%); }
.arrow { z-index: 31; width: 88px; height: 88px; transform: translate(-50%, -100%); }
.ring { z-index: 31; }
.card { z-index: 45; left: 0; width: 1080px; top: 760px; text-align: center; font-size: 104px; color: #fff; }
.comment { z-index: 42; left: 90px; width: 900px; padding: 26px 30px 30px; transform-origin: 20% 50%; }
.comment .who { display: flex; align-items: center; gap: 18px; font-size: 40px; color: #6b5a6e; }
.comment .av { width: 64px; height: 64px; background: #b48cd0; box-shadow: 0 -4px 0 #1b1420, 0 4px 0 #1b1420, -4px 0 0 #1b1420, 4px 0 0 #1b1420; }
.comment .av i { display: block; width: 100%; height: 100%; background: repeating-conic-gradient(#9a72c0 0 25%, #c9a6e0 0 50%) 0 0 / 32px 32px; }
.comment .txt { margin-top: 14px; font-size: 76px; line-height: 1.1; }
.draw { z-index: 20; left: 40px; width: 1000px; top: 380px; height: 700px; background: #26222e; box-shadow: 0 -8px 0 0 #110e16, 0 8px 0 0 #110e16, -8px 0 0 0 #110e16, 8px 0 0 0 #110e16; }
.draw .bar { position: absolute; left: 0; right: 0; top: 0; height: 64px; background: #1a1720; color: #c9bfd8; font-size: 40px; line-height: 64px; padding-left: 22px; }
.draw canvas { position: absolute; image-rendering: pixelated; }
.draw .pal { position: absolute; right: 22px; top: 100px; display: grid; grid-template-columns: 52px 52px; gap: 10px; }
.draw .pal i { display: block; width: 52px; height: 52px; box-shadow: 0 0 0 4px #110e16; }
.draw .pal i.on { box-shadow: 0 0 0 4px #fff; }
.hud { z-index: 25; left: 36px; top: 300px; padding: 10px 18px 12px; font-size: 48px; line-height: 1.2; color: #fff; background: rgba(20, 16, 28, 0.78); white-space: pre; }
.clock { z-index: 25; left: 540px; top: 470px; transform: translateX(-50%); padding: 8px 30px 12px; font-size: 104px; line-height: 1; }
.end { z-index: 50; left: 0; top: 0; width: 1080px; height: 1920px; }
.end .bx { position: absolute; left: 540px; top: 380px; width: 940px; transform: translateX(-50%); text-align: center; }
.end .t1 { font-size: 108px; line-height: 1.1; color: #fff; }
.end .t2 { margin-top: 34px; font-size: 64px; line-height: 1.15; color: #ffd84a; }
.end img { display: block; margin: 0 auto 24px; }
.list { z-index: 33; padding: 14px 24px 16px 18px; transform-origin: 0 0; }
.list .li { display: flex; align-items: center; gap: 14px; font-size: 54px; line-height: 1.25; transform-origin: 0 50%; white-space: nowrap; }
.list .li img { width: 55px; height: 45px; }
.bubble { z-index: 56; max-width: 840px; padding: 16px 30px 22px; background: #fffaf0; color: #1b1420; font-size: 70px; line-height: 1.1;
  box-shadow: 0 -6px 0 0 #1b1420, 0 6px 0 0 #1b1420, -6px 0 0 0 #1b1420, 6px 0 0 0 #1b1420, 0 14px 0 0 rgba(0,0,0,0.3); }
.bubble .tail { position: absolute; top: 100%; margin-top: 3px; width: 42px; height: 36px; image-rendering: pixelated; }
.bubble span { display: none; margin: 0 0.09em; transform-origin: 50% 90%; }
.bubble span.said { display: inline-block; }
.bubble span.now { transform: translateY(-4px) scale(1.08); }
.bubble span.em { color: #e0302c; font-size: 1.18em; }
.flash { z-index: 60; left: 0; top: 0; width: 1080px; height: 1920px; background: #fff; }
</style>
</head>
<body>
<canvas id="bg" width="1080" height="1920"></canvas>
<canvas id="fox" width="1080" height="1920"></canvas>
<div id="ui"></div>
<script type="module" src="./director.js"></script>
</body>
</html>
