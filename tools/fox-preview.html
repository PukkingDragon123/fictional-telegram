<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reynard rig preview</title>
<style>
  :root { --bg: #1d1a2b; --panel: #2b2440; --ink: #fff4e0; --muted: #b9a9d4; --acc: #ffb347; --acc2: #ff7a59; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 12px/1.3 'Trebuchet MS', system-ui, sans-serif; overflow: hidden; }
  canvas#c { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #ui { position: fixed; top: 8px; left: 8px; bottom: 8px; width: 290px; overflow-y: auto; background: rgba(34, 27, 52, 0.88); border: 2px solid #4a3d6a; border-radius: 6px; padding: 8px; box-sizing: border-box; }
  #ui.hide { display: none; }
  #ui h3 { margin: 8px 0 4px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  #ui button { background: #3b3158; color: var(--ink); border: 1px solid #5d4d86; border-radius: 3px; margin: 1px; padding: 3px 6px; font: inherit; cursor: pointer; }
  #ui button:hover { background: #4d4073; }
  #ui button.on { background: var(--acc); color: #2a1a10; border-color: #ffd28a; }
  #ui input[type=text] { width: 100%; box-sizing: border-box; background: #1b1628; color: var(--ink); border: 1px solid #5d4d86; padding: 4px; font: inherit; }
  #label { position: fixed; right: 12px; top: 10px; font: bold 18px 'Trebuchet MS', sans-serif; color: #fff4e0; text-shadow: 0 2px 0 #3a2150, 0 0 6px #3a2150; pointer-events: none; text-align: right; }
  #label small { display: block; font-size: 12px; color: #ffd28a; font-weight: normal; }
  #sheet { position: fixed; inset: 0; overflow: auto; padding: 16px; display: none; }
  #sheet .cell { display: inline-block; margin: 6px; text-align: center; vertical-align: top; }
  #sheet canvas { image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sheet"></div>
<div id="ui"></div>
<div id="label"></div>
<script type="module" src="./fox-preview.js"></script>
</body>
</html>
