<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Villagers UI Preview</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #3d6b4a; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #3d6b4a; } }
  :root[data-theme="dark"] { --bg: #3d6b4a; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--font-body); color: #fdf4d8; -webkit-font-smoothing: none; }
  #world { position: fixed; inset: 0;
    background:
      repeating-conic-gradient(rgba(0,0,0,.035) 0 25%, transparent 0 50%) 0 0 / 6px 6px,
      radial-gradient(ellipse 60% 40% at 55% 62%, #4f8fb0 0 60%, #3f7a5c 61% 66%, transparent 67%),
      linear-gradient(#6aa25a, #4e8a4a); }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #ctl { position: fixed; right: 8px; bottom: 8px; z-index: 400; display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; max-width: 560px; pointer-events: auto; }
  #ctl button { font-family: var(--font-body); font-size: 16px; line-height: 16px; padding: 4px 8px 6px; border: 2px solid #2a1a14; background: #fbf3dc; color: #3b2414; box-shadow: 0 2px 0 #2a1a14; cursor: pointer; }
  #ctl.hide { display: none; }
  #sheet { position: fixed; inset: 0; z-index: 500; overflow: auto; background: #2c190d; padding: 16px; display: none; }
  #sheet.on { display: block; }
  #sheet .row { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 14px; align-items: flex-end; }
  #sheet canvas { image-rendering: pixelated; background: #e9d7ae; }
  #sheet .dk canvas { background: #5e7a8a; }
</style>
</head>
<body>
<div id="world"></div>
<div id="ui"></div>
<div id="ctl"></div>
<div id="sheet"></div>
<script type="module" src="./villagers-ui-preview.js"></script>
</body>
</html>
