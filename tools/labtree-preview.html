<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>LabTree Preview</title>
<link rel="stylesheet" href="/src/ui/fonts.css" />
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'TBME Body', sans-serif; }
  /* fake lab room behind the overlay */
  body { background: radial-gradient(circle at 50% 30%, #3a2c40, #16111d 70%); }
  #wrap { position: fixed; inset: 56px 10px 10px; }
  #dev {
    position: fixed; left: 4px; top: 4px; z-index: 100; font: 12px/1.3 monospace; color: #cfe;
    background: rgba(0,0,0,.85); border: 1px solid #3a6; padding: 4px 6px; max-width: 330px;
  }
  #dev.min > :not(.t) { display: none; }
  #dev .t { cursor: pointer; color: #7f9; }
  #dev button { font: 11px monospace; margin: 2px 2px 0 0; background: #123; color: #cfe; border: 1px solid #3a6; cursor: pointer; }
  #dev #log, #dev #sfx { margin-top: 4px; max-height: 110px; overflow: auto; color: #9b9; white-space: pre-wrap; }
  #closed { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: #fff; font: 22px 'TBME Title', sans-serif; }
  #closed button { font: inherit; padding: 6px 16px; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap"></div>
<div id="closed"><div>Lab closed (onClose called)</div><button id="reopen">Reopen lab</button></div>
<div id="dev" class="min">
  <div class="t">DEV ▾</div>
  <div>
    <button data-a="speed1">x1</button><button data-a="speed10">x10</button><button data-a="speed60">x60</button>
    <button data-a="pause">pause</button><button data-a="finish">finish jobs</button><button data-a="slot">+bench</button>
    <button data-a="zones">toggle zones</button><button data-a="reset">reset</button><button data-a="all">all done</button>
    <button data-a="sound">sound: off</button>
    <button data-a="coins">+250 coins</button><button data-a="broke">broke</button><button data-a="unseal">open sections</button>
  </div>
  <div id="sfx"></div>
  <div id="log"></div>
</div>
<script type="module" src="./labtree-preview.js"></script>
</body>
</html>
