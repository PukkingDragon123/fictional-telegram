<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Unbox Preview</title>
<style>
  @font-face {
    font-family: 'TBME Digits'; font-style: normal; font-weight: 400 700; font-display: swap;
    src: url('/node_modules/@fontsource/silkscreen/files/silkscreen-latin-400-normal.woff2') format('woff2');
    unicode-range: U+0030-0039;
  }
  :root { --bg: #0f1a24; color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1a24; } }
  :root[data-theme="dark"] { --bg: #0f1a24; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: #f4f1e8;
    font-family: 'TBME Digits', 'Pixelify Sans', 'Trebuchet MS', system-ui, sans-serif; }
  #bg { position: fixed; inset: 0; background: #20303c url('/docs/screenshot.png') center / cover no-repeat; image-rendering: pixelated; }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; font-size: 15px; }
  #ui * { box-sizing: border-box; }
  #ui > * { pointer-events: auto; }
  #panel { position: fixed; left: 8px; top: 8px; z-index: 5; display: flex; flex-wrap: wrap; gap: 6px; max-width: min(520px, calc(100vw - 16px));
    background: rgba(14, 24, 34, .9); padding: 10px; box-shadow: 0 0 0 2px #e8f0f4, 0 0 0 4px #1a1420; }
  #panel h1 { width: 100%; margin: 0 0 2px; font-size: 16px; color: #ffc83a; }
  #panel button { background: #2c465a; border: 0; color: #f4f1e8; padding: 6px 10px; font-size: 14px; cursor: pointer; box-shadow: 0 0 0 2px #1a1420, inset 0 2px 0 #4a6a82; }
  #panel label { font-size: 13px; display: inline-flex; gap: 4px; align-items: center; }
  #log { position: fixed; right: 8px; bottom: 8px; z-index: 5; width: 200px; max-height: 30vh; overflow: hidden; font: 11px/1.3 monospace; color: #cfe; background: rgba(0, 0, 0, .55); padding: 6px 8px; white-space: pre; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="panel">
  <h1>Unbox preview</h1>
  <button data-run="one">1 item</button>
  <button data-run="three">3 items</button>
  <button data-run="rare">Rare mix</button>
  <button data-run="legend">Legendary</button>
  <button data-run="many">8 items</button>
  <button data-run="egg">Eggs + bird</button>
  <label><input type="checkbox" id="snd" checked> sound</label>
  <label><input type="checkbox" id="red"> reduced</label>
</div>
<div id="log"></div>
<div id="ui"><div id="ceremony-root"></div></div>
<script type="module" src="./unbox-preview.js"></script>
</body>
</html>
