<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Decals preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a3a2a; overflow: hidden; font: 11px/1.2 monospace; color: #fff; }
  canvas#c { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #labels div { position: fixed; transform: translate(-50%, 0); background: rgba(20, 14, 24, 0.7); padding: 1px 4px; border-radius: 3px; pointer-events: none; white-space: nowrap; }
  #ui { position: fixed; left: 8px; top: 8px; display: flex; gap: 6px; }
  #ui button { font: inherit; background: #2a2036; color: #f4e8d0; border: 2px solid #5a4a6a; padding: 4px 8px; cursor: pointer; }
  #sheet { position: fixed; inset: 0; overflow: auto; background: #3a3040; display: none; padding: 8px; box-sizing: border-box; }
  #sheet div { display: inline-block; margin: 4px; vertical-align: top; text-align: center; }
  #sheet canvas { image-rendering: pixelated; background: #6a8a5a; display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="sheet"></div>
<div id="ui"><button id="night">Night</button><button id="rot">Rotate</button><button id="dec">Decals</button></div>
<script type="module" src="./decals-preview.js"></script>
</body>
</html>
