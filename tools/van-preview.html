<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moose Express van</title>
<style>
  :root { --bg: #1d1a2b; --ink: #fff4e0; --acc: #ffb347; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 12px/1.3 'Trebuchet MS', system-ui, sans-serif; overflow: hidden; }
  canvas#c { display: block; position: fixed; inset: 0; width: 100%; height: 100%; }
  #bar { position: fixed; left: 8px; top: 8px; display: flex; gap: 4px; flex-wrap: wrap; max-width: 80vw; }
  #bar button { background: #3b3158; color: var(--ink); border: 1px solid #5d4d86; border-radius: 3px; padding: 3px 7px; font: inherit; cursor: pointer; }
  #bar button:hover { background: #4d4073; }
  #label { position: fixed; right: 12px; top: 10px; font: bold 18px 'Trebuchet MS', sans-serif; text-shadow: 0 2px 0 #3a2150, 0 0 6px #3a2150; pointer-events: none; text-align: right; }
  #label small { display: block; font-size: 12px; color: #ffd28a; font-weight: normal; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<div id="label"></div>
<script type="module" src="./van-preview.js"></script>
</body>
</html>
