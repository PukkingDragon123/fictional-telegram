<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bear Eat Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bear eating styles in isolation (src/game/BearEat.js + bearRig eat_* poses + preyFx).
     ?style=gulp&type=office&prey=bluegill|duck&t=1.2 (paused at t) &zoom=close|game &strip=0,3,12,6 (contact sheet)
     Console: __seek(t), __set({ style, type, prey, zoom }), __eat -->
<style>
  :root { --bg: #2a2034; --panel: rgba(30, 22, 38, 0.88); --ink: #fff4e4; --dim: #c9b8a8; --hot: #ffb347; --btn: #43324f; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; color: var(--ink); }
  #view { position: absolute; left: 0; right: 0; top: 0; }
  #view canvas { display: block; image-rendering: pixelated; }
  #ui { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
  #ui .row { display: flex; flex-wrap: wrap; gap: 3px; align-items: center; }
  #ui .lbl { color: var(--dim); width: 44px; }
  #ui button { background: var(--btn); color: var(--ink); border: 0; border-radius: 4px; padding: 2px 6px; font: inherit; cursor: pointer; }
  #ui button.on { background: var(--hot); color: #2a1a10; }
  #ui input[type=range] { flex: 1; }
  #ui.hidden { display: none; }
  #info { position: absolute; right: 8px; top: 6px; padding: 2px 6px; background: var(--panel); border-radius: 4px; color: var(--dim); }
</style>
</head>
<body>
<div id="view"><canvas id="c"></canvas></div>
<div id="info"></div>
<div id="ui"></div>
<script type="module" src="./eat-preview.js"></script>
</body>
</html>
