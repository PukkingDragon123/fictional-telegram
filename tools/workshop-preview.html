<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Workshop Preview</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2e5a2a; }
  /* fake game world behind the overlay */
  body {
    background:
      radial-gradient(circle at 30% 40%, #3f7a3a 0 8%, transparent 9%),
      radial-gradient(circle at 70% 65%, #2f6a8a 0 14%, transparent 15%),
      repeating-linear-gradient(45deg, #2e5a2a 0 12px, #336230 12px 24px);
  }
  #wrap { position: fixed; inset: 0; }
  body.sized #wrap { inset: auto; left: 50%; top: 50%; transform: translate(-50%, -50%); outline: 4px solid #111; }
  #dev { position: fixed; left: 4px; bottom: 4px; z-index: 1000; font: 12px/1.3 monospace; color: #cfe; background: rgba(0,0,0,.82); border: 1px solid #3a6; padding: 4px 6px; max-width: 320px; }
  #dev.min > :not(.t) { display: none; }
  #dev .t { cursor: pointer; color: #7f9; }
  #dev button { font: 11px monospace; margin: 2px 2px 0 0; background: #123; color: #cfe; border: 1px solid #3a6; cursor: pointer; }
  #dev #log { margin-top: 4px; max-height: 90px; overflow: auto; color: #9b9; white-space: pre; }
  #closed { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: #fff; font: 20px monospace; }
  #closed button { font: inherit; padding: 6px 16px; cursor: pointer; }
</style>
</head>
<body>
<div id="wrap"></div>
<div id="closed"><div>workshop closed (onClose)</div><button id="reopen">reopen</button></div>
<div id="dev" class="min">
  <div class="t">DEV &#9662;</div>
  <div>
    wood: <b id="wv"></b><br>
    <button data-a="w+">+20 wood</button><button data-a="w-">-20 wood</button><button data-a="mats">+3 all finds</button><br>
    <button data-a="skip">skip 1 min</button><button data-a="skip10">skip 10 min</button><button data-a="fast">fast crafts: off</button><br>
    <button data-a="s800">800x600</button><button data-a="s1024">1024x768</button><button data-a="s1280">1280x720</button><button data-a="sfull">full</button><br>
    <button data-a="sound">sound: off</button><button data-a="unlock">unlock all</button><button data-a="close">close()</button>
  </div>
  <div id="log"></div>
</div>
<script type="module" src="./workshop-preview.js"></script>
</body>
</html>
