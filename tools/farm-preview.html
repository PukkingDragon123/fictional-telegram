<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Farm models preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #2a3a2a; overflow: hidden; font: 11px/1.25 monospace; color: #f4e8d0; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #labels div { position: fixed; transform: translate(-50%, 0); background: rgba(20, 14, 24, 0.72); padding: 1px 4px; border-radius: 3px; pointer-events: none; white-space: nowrap; }
  #ui { position: fixed; left: 8px; top: 8px; display: flex; flex-direction: column; gap: 4px; background: rgba(20, 14, 24, 0.72); padding: 6px 8px; border-radius: 4px; max-height: calc(100vh - 28px); overflow: auto; }
  #ui.hide { display: none; }
  #ui .row { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  #ui b { min-width: 76px; display: inline-block; color: #ffd27a; }
  #ui button { font: inherit; background: #2a2036; color: #f4e8d0; border: 1px solid #5a4a6a; padding: 2px 6px; cursor: pointer; }
  #ui button.on { background: #5a3a7a; border-color: #b08ad8; }
  #ui input[type=range] { width: 110px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="ui"></div>
<script type="module" src="./farm-preview.js"></script>
</body>
</html>
