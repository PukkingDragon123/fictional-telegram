<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Chez Reynard Menu</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #1a0f0c; color-scheme: dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1a0f0c; } }
  :root[data-theme="dark"] { --bg: #1a0f0c; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body { font-family: var(--font-body); color: #fdf4d8; -webkit-font-smoothing: none; }
  /* a stand-in for the pond behind the menu */
  #world { position: fixed; inset: 0;
    background:
      repeating-conic-gradient(rgba(0,0,0,.05) 0 25%, transparent 0 50%) 0 0 / 8px 8px,
      radial-gradient(ellipse 55% 38% at 52% 60%, #3f86a8 0 58%, #3a6e52 59% 66%, transparent 67%),
      linear-gradient(#5f9a52, #3e7642); }
  #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  #ui > * { pointer-events: auto; }
  #ctl { position: fixed; left: 8px; top: 8px; z-index: 400; display: flex; flex-wrap: wrap; gap: 6px; max-width: 520px; pointer-events: auto; }
  #ctl button { font-family: var(--font-body); font-size: 16px; line-height: 16px; padding: 4px 8px 6px; border: 2px solid #2a1a14; background: #fbf3dc; color: #3b2414; box-shadow: 0 2px 0 #2a1a14; cursor: pointer; }
  #ctl.hide { display: none; }
  #sheet { position: fixed; inset: 0; z-index: 500; overflow: auto; background: #2c1a12; padding: 12px; display: none; }
  #sheet.on { display: block; }
  #sheet canvas { image-rendering: pixelated; display: block; }
</style>
</head>
<body>
<div id="world"></div>
<div id="ui"></div>
<div id="ctl"></div>
<div id="sheet"></div>
<script type="module" src="./menu-preview.js"></script>
</body>
</html>
