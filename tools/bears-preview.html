<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Bear Looks Preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg: #2a2034; --panel: rgba(30, 22, 38, 0.9); --ink: #fff4e4; --dim: #c9b8a8; --hot: #ffb347; --btn: #43324f; --btn2: #5a4468; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font: 12px/1.3 ui-monospace, Menlo, Consolas, monospace; color: var(--ink); }
  #wrap { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
  #wrap canvas { display: block; image-rendering: pixelated; }
  #labels { position: absolute; left: 0; top: 0; right: 0; bottom: 0; pointer-events: none; overflow: hidden; }
  .lab { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap; font-size: 10px; line-height: 1.15; color: #fff; text-shadow: 0 1px 0 #000, 1px 0 0 #000, -1px 0 0 #000, 0 -1px 0 #000; }
  .lab b { color: var(--hot); font-weight: normal; }
  .lab i { color: #cfe8ff; font-style: normal; }
  #ui { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); padding: 6px 8px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
  #ui .lbl { color: var(--dim); margin-left: 6px; }
  #ui button { background: var(--btn); color: var(--ink); border: 0; border-radius: 4px; padding: 2px 6px; font: inherit; cursor: pointer; }
  #ui button:hover { background: var(--btn2); }
  #ui button.on { background: var(--hot); color: #2a1a10; }
  #ui select { background: var(--btn); color: var(--ink); border: 0; border-radius: 4px; font: inherit; padding: 2px; }
  #ui.hidden { display: none; }
  #card { position: absolute; right: 8px; top: 8px; width: 270px; max-height: 70%; overflow: auto; background: var(--panel); border-radius: 6px; padding: 8px; display: none; white-space: pre-wrap; font-size: 11px; }
  #card h3 { margin: 0 0 4px; color: var(--hot); font-size: 13px; }
  #info { position: absolute; left: 8px; top: 6px; padding: 2px 6px; background: var(--panel); border-radius: 4px; color: var(--dim); pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas><div id="labels"></div></div>
<div id="info"></div>
<div id="card"></div>
<div id="ui"></div>
<script type="module" src="./bears-preview.js"></script>
</body>
</html>
