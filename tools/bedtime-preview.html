<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bedtime preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #16111d; overflow: hidden; font: 13px/1.3 monospace; color: #f4e8d0; }
  canvas#c { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
  #bar { position: fixed; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; z-index: 100; max-width: calc(100vw - 120px); }
  #bar button { font: inherit; background: #2a2036; color: #f4e8d0; border: 2px solid #5a4a6a; padding: 5px 9px; cursor: pointer; }
  #bar button.on { background: #5a2a6a; border-color: #e8c040; }
  body.bedtime-mode #bar { opacity: 0.25; }
  #info { position: fixed; left: 10px; bottom: 8px; opacity: 0.7; z-index: 100; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar"></div>
<div id="info"></div>
<script type="module" src="./bedtime-preview.js"></script>
</body>
</html>
