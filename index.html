<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#33396e" />
    <title>The Bear Must Eat</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Cg fill='%23e8743b'%3E%3Crect x='2' y='5' width='2' height='2'/%3E%3Crect x='2' y='9' width='2' height='2'/%3E%3Crect x='3' y='7' width='2' height='2'/%3E%3Crect x='5' y='6' width='8' height='4'/%3E%3Crect x='6' y='5' width='6' height='6'/%3E%3Crect x='13' y='7' width='1' height='2'/%3E%3C/g%3E%3Crect x='11' y='7' width='1' height='1' fill='%23fff'/%3E%3C/svg%3E" />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #614b87; }
      #tbme-paint { position: fixed; left: 0; bottom: 0; z-index: 2; image-rendering: pixelated; pointer-events: none; }
    </style>
    <script>
/* The Bear Must Eat: the title screen's first frame. Runs inline in index.html
   before any module loads and paints the whole golden-hour diorama in pixel art:
   sky, far ranges, the stone mountain with the Bear St. office and its
   switchback trail, layered forest, the meadow and Reynard's pond. The live
   scene (src/game/title/) reuses the very same layers as its backdrop (pixel
   exact hand-over) and adds everything that moves. */
(function () {
  var BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  var R = Math.round, F = Math.floor, A = Math.abs, MAX = Math.max, MIN = Math.min;
  function by(x, y) { return (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16; }
  function h1(n) { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - F(n); }

    return stops[stops.length - 1][1];
  }
  function layer(w, h) {
    var c = document.createElement('canvas'); c.width = w; c.height = h;
    var x = c.getContext('2d'), img = x.createImageData(w, h), d = img.data;
    return { c: c, w: w, h: h, d: d,
      put: function (px, py, rgb) { px = F(px); py = F(py); if (px < 0 || py < 0 || px >= w || py >= h) return; var o = (py * w + px) * 4; d[o] = rgb[0]; d[o + 1] = rgb[1]; d[o + 2] = rgb[2]; d[o + 3] = 255; },
      has: function (px, py) { return px >= 0 && py >= 0 && px < w && py < h && d[(py * w + px) * 4 + 3] > 0; },
      get: function (px, py) { var o = (py * w + px) * 4; return [d[o], d[o + 1], d[o + 2]]; },
      clear: function (px, py) { if (px >= 0 && py >= 0 && px < w && py < h) d[(py * w + px) * 4 + 3] = 0; },

  }
  var C = {
    sky: [[0.0, 0xffe6a8], [0.07, 0xffcf82], [0.16, 0xffb172], [0.27, 0xf9926f], [0.39, 0xe8767a], [0.52, 0xc2648c], [0.65, 0x91588f], [0.79, 0x614b87], [1.0, 0x33396e]],
  };
  var SKY = C.sky.map(function (s) { return [s[0], hex(s[1])]; });

  function size() {
    var dpr = MIN(window.devicePixelRatio || 1, 3), dens = 1;
    try { dens = +localStorage.getItem('tbme.px') || 1; } catch (e) { /* no storage */ }

    var ps = MAX(1, R(Math.sqrt(W * W + H * H) / (760 * dens)));
    return { dpr: dpr, ps: ps, lw: Math.ceil(W / ps), lh: Math.ceil(H / ps) };
  }

  // ------------------------------------------------------------ layout (low-res px, y down)
  function layout(lw, lh) {
    var tall = lh > lw * 1.15, hy = R(lh * (tall ? 0.5 : 0.585)), below = lh - hy;
    var L = { lw: lw, lh: lh, tall: tall, hy: hy, M: 16, u: MIN(1.7, MAX(1, tall ? lw / 293 : lh / 267)) };
    L.sun = tall ? { x: R(lw * 0.86), y: R(lh * 0.4), r: MAX(8, R(lw * 0.04)) } : { x: R(lw * 0.865), y: R(lh * 0.43), r: MAX(8, R(lh * 0.042)) };
    L.f3 = hy + R(below * (tall ? 0.06 : 0.1)); // far forest: tree bases
    L.f2 = hy + R(below * (tall ? 0.24 : 0.33)); // near forest: tree bases (the meadow starts here)
    L.mt = tall ? { l: R(lw * 0.0), r: R(lw * 1.0), peakX: R(lw * 0.32), peakY: R(lh * 0.222), plat: R(lh * 0.302), offX: R(lw * 0.66), base: L.f3 + 6 }
      : { l: R(lw * 0.2), r: R(lw * 0.86), peakX: R(lw * 0.43), peakY: R(lh * 0.065), plat: R(lh * 0.255), offX: R(lw * 0.59), base: L.f3 + 6 };

      : { x: R(lw * 0.6), y: L.f2 + R(mt * 0.46), rx: R(lw * 0.22), ry: MAX(11, R(mt * 0.19)) };
    L.fox = { x: R(L.pond.x + L.pond.rx * 0.48), y: L.pond.y + L.pond.ry + (tall ? 7 : 5) };
    return L;
  }

  // ------------------------------------------------------------ sky
  function paintSky(L) {
    var lw = L.lw, lh = L.lh, hy = L.hy, S = L.sun, s = layer(lw, lh), span = MAX(40, hy + 6);
    var glow = [hex(0xfff6dc), hex(0xffeab4), hex(0xffd994)];
    for (var y = 0; y < lh; y++) for (var x = 0; x < lw; x++) {
      var d = by(x, y), dx = (x - S.x) / lw, dy = (y - S.y) / span;
      var near = Math.exp(-(dx * dx * 5 + dy * dy * 3));
      var c = ramp(SKY, (hy - y) / span - near * 0.22 + (1 - near) * 0.05, d);
      var gx = (x - S.x) * 0.62, gy = (y - S.y) * 1.25, g = Math.sqrt(gx * gx + gy * gy) / S.r;
      if (g < 7.5) {
        var k = g < 2 ? 0 : g < 3.3 ? 1 : g < 5 ? 2 : 3;
        var e = g < 2 ? (g - 1.5) / 0.5 : g < 3.3 ? (g - 2.6) / 0.7 : g < 5 ? (g - 4.1) / 0.9 : (g - 6.2) / 1.3;

      }
      s.put(x, y, c);
    }
    for (var yy = -S.r; yy <= S.r; yy++) for (var xx = -S.r; xx <= S.r; xx++) {
      var rr = Math.sqrt(xx * xx + yy * yy);
      if (rr > S.r + 0.3) continue;
      var cc = rr > S.r - 1.2 ? hex(0xffe08a) : rr > S.r * 0.6 ? hex(0xfff2c0) : hex(0xfffbea);
      if (yy === R(S.r * 0.4) || yy === R(S.r * 0.75)) cc = mixc(cc, hex(0xffb070), 0.7);
      s.put(S.x + xx, S.y + yy, cc);
    }
    var nst = R(lw * lh / 3800);
    for (var i = 0; i < nst; i++) {
      var sx = F(h1(i * 3.1 + 1) * lw * 0.66), sy = F(h1(i * 7.7 + 2) * hy * 0.42);
      if (sy / hy > 0.34 + h1(i) * 0.1) continue;
      var big = h1(i * 13.3) > 0.86, dim = hex(0xb89ac8);
      s.put(sx, sy, hex(big ? 0xfff6ff : 0xe6cfe8));
      if (big) { s.put(sx - 1, sy, dim); s.put(sx + 1, sy, dim); s.put(sx, sy - 1, dim); s.put(sx, sy + 1, dim); }
    }
    return s.done();
  }

  // ------------------------------------------------------------ clouds: puffy, flat-bottomed, lit from below-right
  function shadeEdges(L, s0, col, M) {
    var out = layer(s0.w, s0.h), S = L.sun, W0 = s0.w;
    var s = { w: s0.w, h: s0.h, has: function (x, y) { return s0.has(((x % W0) + W0) % W0, y); } };
    for (var y = 0; y < s.h; y++) for (var x = 0; x < s.w; x++) {
      if (!s.has(x, y)) continue;
      var dS = A(x - M - S.x) / L.lw, hot = dS < 0.1 ? col.hot : dS < 0.28 ? col.warm : col.lit;
      var c = col.body;
      if (!s.has(x, y + 1)) c = hot;
      else if (!s.has(x, y + 2)) c = by(x, y) > 0.5 ? hot : mixc(hot, col.body, 0.5);
      else if (!s.has(x + 1, y) || !s.has(x + 2, y + 1)) c = mixc(hot, col.body, 0.35);
      else if (!s.has(x, y - 1) || (!s.has(x, y - 2) && by(x, y) > 0.6)) c = col.top;
      out.put(x, y, c);
    }
    return out;
  }
  function paintClouds(L, top, bot, seed, col, count) {
    var M = L.M, w = L.lw + M * 2, h = bot - top + 1, s = layer(w, h), blobs = [];
    for (var k = 0; k < count; k++) {
      var len = L.lw * (0.12 + h1(seed + k * 3.3) * 0.22), cx = h1(seed + k * 5.1) * w, base = R(h * (0.3 + h1(seed + k * 9.7) * 0.62));
      var th = (L.tall ? 3 : 4) + h1(seed + k * 1.9) * (L.tall ? 5 : 7), n = 3 + F(h1(seed + k * 4.4) * 4);
      var dsx = cx - M - L.sun.x, dsy = base + top - L.sun.y;
      if (A(dsx) < len * 0.7 + L.sun.r * 2 && A(dsy) < L.sun.r * 2.2) continue; // keep the sun clear

        var u = (j + 0.5) / n - 0.5, mid = 1 - A(u) * 1.6;
        blobs.push({ x: cx + u * len, rx: len / n * (0.9 + h1(seed + k + j) * 0.7), ry: th * (0.45 + mid * 0.7) * (0.7 + h1(seed * 2 + k + j) * 0.6), base: base });
      }
    }
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) for (var b = 0; b < blobs.length; b++) {
      var B = blobs[b];
      if (y > B.base) continue;
      var dxw = x - B.x; dxw -= w * R(dxw / w);
      var ex = dxw / B.rx, ey = (y - B.base) / B.ry;

  }

  // ------------------------------------------------------------ far ranges
  function paintRange(L, base, peak, seed, col, snowAt) {
    var M = L.M, w = L.lw + M * 2, top = MAX(0, base - peak - 2), h = base - top + 1, s = layer(w, h), hs = [], x;
    for (x = 0; x < w; x++) {

    }
    var pk = [];
    for (x = 0; x < w; x++) {
      var isP = true;
      for (var k = 1; k <= 5 && isP; k++) if (hs[MAX(0, x - k)] > hs[x] || hs[MIN(w - 1, x + k)] > hs[x]) isP = false;
      if (isP && (!pk.length || x - pk[pk.length - 1].x > 4)) pk.push({ x: x, h: hs[x] });
    }
    if (!pk.length) pk.push({ x: w >> 1, h: hs[w >> 1] });
    for (x = 0; x < w; x++) {
      var ht = R(hs[x]), P = pk[0], bd = 1e9;
      for (var i = 0; i < pk.length; i++) { var dd = A(x - pk[i].x) * 1.2 - pk[i].h; if (dd < bd) { bd = dd; P = pk[i]; } }
      for (var j = 0; j <= ht; j++) {

        var c = lit ? (x > div + 3 + below * 0.6 && d > 0.5 ? mixc(col.lit, col.body, 0.4) : col.lit) : col.body;
        if (!lit && x < div - 1 && n1(x * 0.5 + j * 0.9, seed + 5) > 0.72) c = col.crease;
        if (j >= ht) c = lit ? col.rimLit : col.rim;

        if (snowAt && j > sl && P.h > peak * (snowAt + 0.08)) c = lit ? col.snowLit : col.snow;
        var hz = MAX(0, 1 - j / (peak * 0.6));
        if (hz > d * 1.25) c = mixc(c, col.haze, 0.55 * hz + 0.1);
        s.put(x, py - top, c);
      }
    }
    return { c: s.done(), y: top };
  }

  // ------------------------------------------------------------ the stone mountain + office + trail
  var GLYPH = { B: '##.#.###.#.##.', E: '####..##.#..###', A: '.#.#.####.##.#', R: '##.#.###.##.#', S: '.###...#...###.', T: '###.#..#..#.', '.': '.....#' };
  var FONT3 = { // 3x5 caps
    B: ['##.', '#.#', '##.', '#.#', '##.'], E: ['###', '#..', '##.', '#..', '###'], A: ['.#.', '#.#', '###', '#.#', '#.#'], R: ['##.', '#.#', '##.', '#.#', '#.#'],
    S: ['.##', '#..', '.#.', '..#', '##.'], T: ['###', '.#.', '.#.', '.#.', '.#.'], '.': ['...', '...', '...', '...', '.#.'], ' ': ['...', '...', '...', '...', '...'] };
  function text3(s, str, x0, y0, rgb) {
    for (var i = 0; i < str.length; i++) { var g = FONT3[str[i]] || FONT3[' ']; for (var r = 0; r < 5; r++) for (var c = 0; c < 3; c++) if (g[r][c] === '#') s.put(x0 + i * 4 + c, y0 + r, rgb); }
  }
  function paintMountain(L) {
    var M = L.M, mt = L.mt, w = L.lw + M * 2, top = MAX(0, mt.peakY - 4), base = mt.base, h = base - top + 1, s = layer(w, h);
    var ox = mt.offX, plat = mt.plat, ow = 27;
    // silhouette key points (x, y) left -> right
    var kp = [[mt.l - 30, base + 4], [mt.l, base - (base - plat) * 0.08], [mt.l + (mt.peakX - mt.l) * 0.45, plat + (base - plat) * 0.18],

      [mt.peakX + (ox - ow - mt.peakX) * 0.55, mt.peakY + (plat - mt.peakY) * 0.62], [ox - ow, plat], [ox + ow, plat],
      [ox + ow + 8, plat + 6], [ox + ow + (mt.r - ox - ow) * 0.45, plat + (base - plat) * 0.42], [mt.r, base - (base - plat) * 0.1], [mt.r + 30, base + 4]];

      }

      if (!flat) y += (n1(X * 0.18, 13) - 0.5) * 6 + (n1(X * 0.6, 17) - 0.5) * 2.4 + (h1(X * 3.3) > 0.85 ? -1 : 0);
      prof[x] = y;
    }
    // spurs: ridge lines running down from the summit and the shoulders (x positions per row)
    var spurs = [];
    var addSpur = function (x0, y0, drift, seed) { spurs.push({ x0: x0, y0: y0, drift: drift, seed: seed }); };
    addSpur(mt.peakX, mt.peakY, 0.18, 1);
    addSpur(mt.peakX - (mt.peakX - mt.l) * 0.35, mt.peakY + (plat - mt.peakY) * 0.9, -0.35, 2);
    addSpur(mt.peakX + (ox - ow - mt.peakX) * 0.55, mt.peakY + (plat - mt.peakY) * 0.6, 0.12, 3);
    addSpur(ox - ow + 4, plat + 3, -0.2, 4);
    addSpur(ox + ow - 2, plat + 2, 0.3, 5);
    addSpur(ox + ow + (mt.r - ox - ow) * 0.4, plat + (base - plat) * 0.42, 0.25, 6);
    addSpur(mt.l + (mt.peakX - mt.l) * 0.3, plat + (base - plat) * 0.3, -0.15, 7);
    var spurX = function (sp, y) { var d = y - sp.y0; return d < 0 ? null : sp.x0 + d * sp.drift + (n1(y * 0.22, sp.seed * 7) - 0.5) * 4; };
    var col = { lit: hex(0xe9a17c), lit2: hex(0xd18a7c), mid: hex(0xa2707e), mid2: hex(0x8e6478), shade: hex(0x6a5274), shade2: hex(0x5a4668),
      crack: hex(0x4a3a5c), rim: hex(0xffd2a0), snow: hex(0xc9b6dc), snowLit: hex(0xfff1dc), snowMid: hex(0xf0d2d0), grass: hex(0x8a8a5a), grassLit: hex(0xc8b062), haze: hex(0xe8a69a) };
    var snowLine = mt.peakY + (plat - mt.peakY) * 0.55;

      for (var y2 = MAX(top, ty); y2 <= base; y2++) {

        if (sy % 9 < 1 && n1(X2 * 0.21 + y2, 8) > 0.45) c = mixc(c, col.crack, 0.7);
        // the silhouette catches the sun on its right-facing ridges
        if (fromTop < 1) c = prof[MIN(w - 1, x2 + 1)] > prof[x2] - 0.2 ? col.rim : mixc(col.mid, col.rim, 0.3);
        // snow above the snow line, jagged
        var sn = snowLine + (n1(X2 * 0.3, 21) - 0.5) * 10 + (X2 > mt.peakX ? 4 : 0);
        if (y2 < sn && X2 < ox - ow - 4) c = dl < dr * 0.9 ? (fromTop < 2 || d > 0.4 ? col.snowLit : col.snowMid) : col.snow;
        // grassy ledges low down

        // haze thickens towards the valley

      }
    }

    var legs = L.tall ? 5 : 4, pts = [[ox - 3, plat + 1]], yA = plat + 1, yB = base - 3;
    var faceAt = function (yy) {
      var a = -1, b = -1;

      for (var xe = w - 1; xe >= 0; xe--) if (prof[xe] < yy - 7) { b = xe - M; break; }

    };
    for (var lg = 1; lg <= legs; lg++) {
      var tt = lg / legs, yy = R(yA + (yB - yA) * Math.pow(tt, 0.85));
      var fb = faceAt(yy), wd = fb[1] - fb[0];
      var xx = lg === legs ? L.gapX : lg % 2 ? fb[0] + wd * (0.12 + 0.06 * tt) : fb[1] - wd * (0.16 + 0.04 * tt);
      if (lg % 2 === 0) xx = MIN(xx, L.sun.x - L.sun.r - 14);
      pts.push([R(xx), yy]);
    }
    var trail = [];
    var path = hex(0xf2c690), pathD = hex(0xd09c74), lip = hex(0x4a3656), lip2 = hex(0x5e4466), cut = hex(0x7a5672);
    for (var p = 0; p < pts.length - 1; p++) {
